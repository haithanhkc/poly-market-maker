[project]
name = "paper-split-maker"
version = "0.1.0"
description = "Two-sided maker sell bot for Polymarket BTC Up/Down. Paper by default; live is opt-in."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
live = ["py-clob-client-v2", "web3", "websockets"]

[project.scripts]
paper-split-maker = "paper_split_maker.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["paper_split_maker*"]

[tool.setuptools.package-data]
paper_split_maker = ["scenarios/*.json"]
