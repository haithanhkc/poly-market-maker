[project]
name = "paper-split-maker"
version = "0.1.0"
description = "Paper-only two-sided sell ledger for Polymarket BTC Up/Down markets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
paper-split-maker = "paper_split_maker.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["paper_split_maker*"]

[tool.setuptools.package-data]
paper_split_maker = ["scenarios/*.json"]
